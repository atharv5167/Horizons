<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizons — Luxury Travel Experiences</title>
  <meta name="description" content="Horizons is a luxury travel agency offering curated tropical escapes, private villas, and bespoke island experiences.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    /* ───────────── RESET ───────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: auto; }
    html, body {
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE/Edge */
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none; /* Chrome/Safari/Webkit */
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ───────────── LOADER ───────────── */
    #loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0a0a0a;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .loader-brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      margin-bottom: 48px;
    }

    .loader-label {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-bottom: 20px;
    }

    .loader-track {
      width: 280px; height: 2px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    #loader-bar {
      width: 0%; height: 100%;
      background: #fff;
      border-radius: 2px;
      transition: width 0.15s linear;
    }

    #loader-pct {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.35);
      margin-top: 14px;
      font-variant-numeric: tabular-nums;
    }

    /* ───────────── EXPERIENCE (scroll section) ───────────── */
    #experience {
      display: none;
      position: relative;
      width: 100%;
      /* 213 frames × 30px per frame = slow cinematic pacing */
      height: 6390px;
    }

    #frame-canvas {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      display: block;
    }

    /* ───────────── OVERLAY LAYER ───────────── */
    #overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: none;
    }

    /* ───────────── EXPLORE BUTTON ───────────── */
    .scene {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: none;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      border: 1.5px solid rgba(255,255,255,0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      background: rgba(255,255,255,0.1);
      border-radius: 100px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 11px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      color: #fff;
      padding: 14px 32px;
      text-decoration: none;
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
    }
    .pill-btn:hover {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.9);
      transform: scale(1.03);
    }

    /* ───────────── FADE OVERLAY (for transition to home) ───────────── */
    #fade-overlay {
      position: fixed; inset: 0;
      background: #0a0a0a;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    #fade-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ───────────── HOME PAGE ───────────── */
    #home-page {
      display: none;
      position: fixed; inset: 0;
      z-index: 200;
      background: #0a0a0a;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #home-page.visible {
      display: flex;
    }

    .home-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(48px, 8vw, 120px);
      letter-spacing: 0.06em;
      color: #fff;
      text-align: center;
    }

    /* ───────────── MOBILE ───────────── */
    @media (max-width: 768px) {
      #experience { height: 4260px; } /* 213 × 20px */
      .pill-btn { font-size: 10px; padding: 12px 24px; }
    }
  </style>
</head>
<body>

  <!-- ───────────── LOADER ───────────── -->
  <div id="loader">
    <div class="loader-brand">Horizons</div>
    <p class="loader-label">Loading your journey</p>
    <div class="loader-track"><div id="loader-bar"></div></div>
    <p id="loader-pct">0%</p>
  </div>

  <!-- ───────────── SCROLL EXPERIENCE ───────────── -->
  <div id="experience">
    <canvas id="frame-canvas"></canvas>
  </div>

  <!-- ───────────── OVERLAY (Explore button) ───────────── -->
  <div id="overlay">
    <div class="scene" id="scene-final">
      <button class="pill-btn" id="explore-btn">Let's Explore →</button>
    </div>
  </div>

  <!-- ───────────── FADE OVERLAY ───────────── -->
  <div id="fade-overlay"></div>

  <!-- ───────────── HOME PAGE ───────────── -->
  <div id="home-page">
    <h1 class="home-title">Home Page</h1>
  </div>

  <script>
    /* ═══════════════════════════════════════════════
       CONFIGURATION
       ═══════════════════════════════════════════════ */
    const TOTAL_FRAMES    = 246;
    const SCROLL_FRAMES   = 213;   // frames 1–213 are scroll-driven
    const VIDEO_START     = 214;   // frames 214–246 auto-play after click
    const VIDEO_END       = 246;
    const VIDEO_FPS       = 16;

    /* ═══════════════════════════════════════════════
       DOM REFS
       ═══════════════════════════════════════════════ */
    const loaderEl      = document.getElementById('loader');
    const loaderBar     = document.getElementById('loader-bar');
    const loaderPct     = document.getElementById('loader-pct');
    const experienceEl  = document.getElementById('experience');
    const overlayEl     = document.getElementById('overlay');
    const canvas        = document.getElementById('frame-canvas');
    const ctx           = canvas.getContext('2d');
    const sceneFinal    = document.getElementById('scene-final');
    const exploreBtn    = document.getElementById('explore-btn');
    const fadeOverlay   = document.getElementById('fade-overlay');
    const homePage      = document.getElementById('home-page');

    /* ═══════════════════════════════════════════════
       STATE
       ═══════════════════════════════════════════════ */
    const frames = [];
    let loaded = 0;
    let isVideoPlaying = false;
    let currentSmooth = 0;       // lerp-smoothed frame index
    let targetFrame   = 0;       // target frame from scroll
    const LERP_SPEED  = 0.08;    // lower = smoother/slower interpolation

    /* ═══════════════════════════════════════════════
       PRELOAD ALL 246 FRAMES
       Frames are named 1.png, 2.png … 246.png (no zero-padding)
       ═══════════════════════════════════════════════ */
    for (let i = 1; i <= TOTAL_FRAMES; i++) {
      const img = new Image();
      img.src = `frames_webp/${i}.webp`;
      img.onload = onFrameLoaded;
      img.onerror = onFrameLoaded;
      frames.push(img);
    }

    function onFrameLoaded() {
      loaded++;
      const pct = Math.round((loaded / TOTAL_FRAMES) * 100);
      loaderBar.style.width = pct + '%';
      loaderPct.textContent = pct + '%';
      if (loaded === TOTAL_FRAMES) startExperience();
    }

    /* ═══════════════════════════════════════════════
       START EXPERIENCE
       ═══════════════════════════════════════════════ */
    function startExperience() {
      resizeCanvas();
      drawFrame(0);
      updateOverlays(0);

      experienceEl.style.display = 'block';
      overlayEl.style.display = 'block';

      requestAnimationFrame(() => {
        loaderEl.classList.add('hidden');
      });

      // Scroll updates the TARGET frame (raw, instant)
      window.addEventListener('scroll', () => {
        if (isVideoPlaying) return;
        targetFrame = getScrollFrameIndex();
      }, { passive: true });

      // Lerp animation loop — smoothly interpolates toward target
      function smoothLoop() {
        if (!isVideoPlaying) {
          currentSmooth += (targetFrame - currentSmooth) * LERP_SPEED;

          // Snap if close enough to avoid infinite micro-steps
          if (Math.abs(currentSmooth - targetFrame) < 0.3) {
            currentSmooth = targetFrame;
          }

          const displayIdx = Math.round(currentSmooth);
          drawFrame(displayIdx);
          updateOverlays();
        }
        requestAnimationFrame(smoothLoop);
      }
      requestAnimationFrame(smoothLoop);

      // Resize handler
      window.addEventListener('resize', () => {
        resizeCanvas();
      });

      // Explore button click → start auto-play sequence
      exploreBtn.addEventListener('click', (e) => {
        e.preventDefault();
        startVideoSequence();
      });
    }

    /* ═══════════════════════════════════════════════
       CANVAS SIZING — cover behavior
       ═══════════════════════════════════════════════ */
    function resizeCanvas() {
      canvas.width  = window.innerWidth  * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
      canvas.style.width  = '100%';
      canvas.style.height = '100vh';
    }

    /* ═══════════════════════════════════════════════
       DRAW FRAME — object-fit: cover equivalent
       idx is 0-based (0 = frame 1)
       ═══════════════════════════════════════════════ */
    function drawFrame(idx) {
      const img = frames[idx];
      if (!img || !img.naturalWidth) return;

      const cw = canvas.width;
      const ch = canvas.height;
      const iw = img.naturalWidth;
      const ih = img.naturalHeight;

      const scale = Math.max(cw / iw, ch / ih);
      const sw = cw / scale;
      const sh = ch / scale;
      const sx = (iw - sw) / 2;
      const sy = (ih - sh) / 2;

      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
    }

    /* ═══════════════════════════════════════════════
       SCROLL → FRAME INDEX (0-based, 0–212)
       ═══════════════════════════════════════════════ */
    function getScrollFrameIndex() {
      const scrollH = document.body.scrollHeight - window.innerHeight;
      if (scrollH <= 0) return 0;
      
      const totalProgress = window.scrollY / scrollH;
      
      // Camera movement finishes at 85% scroll
      // This ensures the image is static well before the Explore button reaches full opacity
      const animationEnd = 0.85; 
      const animationProgress = Math.min(1, totalProgress / animationEnd);
      
      return Math.min(SCROLL_FRAMES - 1, Math.max(0, Math.floor(animationProgress * (SCROLL_FRAMES - 1))));
    }

    /* scroll handler removed — lerp loop handles drawing */

    /* ═══════════════════════════════════════════════
       OVERLAY — Explore button fades in near frame 213
       ═══════════════════════════════════════════════ */
    function updateOverlays() {
      const scrollH = document.body.scrollHeight - window.innerHeight;
      if (scrollH <= 0) return;
      const totalProgress = window.scrollY / scrollH;

      // Button only starts fading in AFTER the animation finishes (at 85% scroll)
      // It reaches full opacity at 95% scroll, while the image remains static
      const fadeStart = 0.85;
      const fadeEnd   = 0.95;
      
      let opacity = 0;
      if (totalProgress > fadeStart) {
        opacity = Math.min(1, (totalProgress - fadeStart) / (fadeEnd - fadeStart));
      }

      sceneFinal.style.opacity = opacity;
      sceneFinal.style.pointerEvents = opacity > 0.5 ? 'auto' : 'none';
    }

    /* ═══════════════════════════════════════════════
       AUTO-PLAY VIDEO SEQUENCE (frames 214–246)
       After clicking Explore, play remaining frames
       as a smooth video, then fade to home page.
       ═══════════════════════════════════════════════ */
    function startVideoSequence() {
      if (isVideoPlaying) return;
      isVideoPlaying = true;

      // Hide the Explore button immediately
      sceneFinal.style.opacity = 0;
      sceneFinal.style.pointerEvents = 'none';

      // Disable page scrolling
      document.body.style.overflow = 'hidden';

      let currentFrame = VIDEO_START - 1; // 0-based index: 213
      const endFrame   = VIDEO_END - 1;   // 0-based index: 245
      const interval   = 1000 / VIDEO_FPS;

      function playNext() {
        if (currentFrame > endFrame) {
          // Video finished → fade to home
          fadeToHome();
          return;
        }
        drawFrame(currentFrame);
        currentFrame++;
        setTimeout(playNext, interval);
      }

      playNext();
    }

    /* ═══════════════════════════════════════════════
       FADE TO HOME PAGE
       ═══════════════════════════════════════════════ */
    function fadeToHome() {
      // Step 1: Fade overlay to black
      fadeOverlay.classList.add('active');

      // Step 2: After fade completes, navigate to home.html
      setTimeout(() => {
        window.location.href = 'home.html';
      }, 1000); 
    }
  </script>
</body>
</html>
